name: CI

on: [push, pull_request]

jobs:
  build:
    name: ${{ matrix.name }} Build
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows dropped in this fork: it fails to link against the patched
          # SDK (unrelated KeyValues3 externals) and BoneHost only runs Linux.
          - os: ubuntu-latest
            name: SteamRT3
            container: ghcr.io/source2ze/build-containers:steamrt3
          - os: ubuntu-latest
            name: SteamRT4
            container: ghcr.io/source2ze/build-containers:steamrt4
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: SLPF
          submodules: recursive
          fetch-depth: 0

      - name: Checkout Metamod
        uses: actions/checkout@v7
        with:
          repository: alliedmodders/metamod-source
          ref: master
          path: mmsource-2.0
          submodules: recursive

      - name: Checkout s2sdk
        uses: actions/checkout@v7
        with:
          # alliedmodders/s2sdk PR #128 (CS2 build 26879581 inserted a virtual
          # into ISource2Server after GameCreateNetworkStringTables; GameFrame
          # and every later slot moved by one).
          repository: vindict6/hl2sdk-cs2
          ref: ccd5b3e116864c0e7f6a0044046223cb772d33b7
          path: hl2sdk-cs2

      - name: Checkout AMBuild
        if: matrix.os == 'windows-latest'
        uses: actions/checkout@v7
        with:
          repository: alliedmodders/ambuild
          path: ambuild

      - name: Install AMBuild
        if: matrix.os == 'windows-latest'
        run: pip install setuptools && cd ambuild && python setup.py install && cd ..

      - name: Build
        working-directory: SLPF
        shell: bash
        run: |
          mkdir build && cd build
          python ../configure.py --enable-optimize --sdks cs2
          ambuild

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: SLPF/build/package/cs2

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: Package
        run: |
          version=`echo $GITHUB_REF | sed "s/refs\/tags\///"`
          ls -Rall
          if [ -d "./SteamRT3/" ]; then
            cd ./SteamRT3/
            tar -czf ../${{ github.event.repository.name }}-${version}-steamrt3.tar.gz *
            cd -
          fi
          if [ -d "./SteamRT4/" ]; then
            cd ./SteamRT4/
            tar -czf ../${{ github.event.repository.name }}-${version}-steamrt4.tar.gz *
            cd -
          fi
          if [ -d "./Windows/" ]; then
            cd ./Windows/
            zip -r ../${{ github.event.repository.name }}-${version}-windows.zip *
            cd -
          fi

      - name: Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ github.event.repository.name }}-*
          tag: ${{ github.ref }}
          file_glob: true
